name: pak_riders
description: Pak Riders - Ride Sharing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  flutter_rating_bar: ^4.0.1
  location: ^6.0.0
  fluttertoast: ^8.2.6
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  win32: ^5.8.0