name: pak_riders
description: Pak Riders - Ride Sharing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  flutter_rating_bar: ^4.0.1
  location: ^8.0.1
  fluttertoast: ^8.2.12
  flutter_local_notifications: ^18.0.1
    flutter_local_notifications_linux: ^4.0.1
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  win32: ^5.8.0